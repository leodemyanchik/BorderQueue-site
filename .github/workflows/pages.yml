# Выкладка сайта на GitHub Pages.
#
# Сервис закрыт 10.11.2026: бот @BorderTimerBot и его API удалены, и все страницы сайта говорят
# об этом. Цифр больше нет, поэтому нет ни пересборки по расписанию, ни tools/build.py (он брал
# цифры из API, которого больше нет): репозиторий выкладывается как есть, только по пушу.
#
# Для работы в Settings → Pages источником должен быть выбран «GitHub Actions».
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
